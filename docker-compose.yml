services:
  web:
    image: nginx:1.27-alpine
    container_name: it-escape-game-web
    restart: unless-stopped
    networks:
      - my-proxy-network
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  my-proxy-network:
    external: true
